[package]
name = "vps-config"
version = "0.1.0"
edition = "2021"
description = "Remote VPS provisioning wizard"

[dependencies]
clap = { version = "4", features = ["derive"] }
russh = "0.50"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dialoguer = "0.11"
console = "0.15"
colored = "2"
anyhow = "1"
async-trait = "0.1"
dirs = "5"
shellexpand = "3"
